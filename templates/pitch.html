<!doctype html>
<html lang="ja" data-theme="green" data-mode="pitch">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>タイトル（発表）</title>
<style id="html-slides-lib">/*LIB:CSS*/
/*END LIB:CSS*/</style>
<style>
  /* このデッキだけの CSS。映す発表では画面の文字をすべて 54px 以上にする（発表者メモは除く） */
</style>
</head>
<body>
<!-- 映す発表：1ページ1メッセージ、絵と数字が主役。台本は <aside class="notes">、目標の終わりの時刻は data-end="分:秒"。
     キー：N メモ／P 発表者用の窓／T 時計を0に／F 全画面 -->

<section id="cover" class="cover" data-nopno data-end="0:10">
  <div class="kicker">PROJECT 2026</div>
  <h1>サービス名</h1>
  <div class="lead">ひとことで言うと何か</div>
  <div class="ph hero-img">表紙の絵</div>
  <aside class="notes">最初のひとこと。名前と、誰に何を届けるかを言う。</aside>
</section>

<section id="say" data-end="0:30">
  <div class="center fill">
    <div class="say">言いたいことを<br><em>強調色</em>で1つだけ</div>
  </div>
  <aside class="notes">このページで話すこと。</aside>
</section>

<section id="number" data-end="0:50">
  <div class="kicker">MARKET</div>
  <div class="center" style="height:760px">
    <div class="bignum"><span data-f="rev.2"></span><small>億円</small></div>
    <div class="bignum-k">3年目の売上高の目標</div>
  </div>
  <aside class="notes">数字の意味と根拠をひとこと。</aside>
</section>

<section id="three" data-end="1:10">
  <h1>3つの絵と短い言葉で並べる</h1>
  <div class="rule"></div>
  <div class="trio">
    <figure><div class="ph" style="height:480px">絵</div><figcaption>見る</figcaption></figure>
    <figure><div class="ph" style="height:480px">絵</div><figcaption>選ぶ</figcaption></figure>
    <figure><div class="ph" style="height:480px">絵</div><figcaption>届く</figcaption></figure>
  </div>
  <aside class="notes">左から順に説明する。</aside>
</section>

<section id="bars" data-end="1:30">
  <h1>グラフは棒3〜5本、数字は大きく</h1>
  <div class="rule"></div>
  <div class="chart" style="height:700px" data-chart='{"type":"bar","labels":["1年目","2年目","3年目"],"series":[{"values":"@rev"}],"highlight":2}'></div>
  <aside class="notes">伸び方を指でなぞるように話す。</aside>
</section>

<section id="close" class="dark" data-end="1:45" data-nopno>
  <div class="center fill">
    <div class="say">最後に言うこと</div>
    <div class="band" style="margin-top:60px; background:transparent">お願いしたいこと</div>
  </div>
  <aside class="notes">締めのひとこと。</aside>
</section>

<script>/*DATA*/window.DATA = {"rev": [76, 817, 1656]};/*END DATA*/</script>
<script id="html-slides-lib-js">/*LIB:JS*/
/*END LIB:JS*/</script>
<script>
  /* このデッキだけのスクリプト */
</script>
</body>
</html>
